# Dev override — db + mailpit + app (tsx watch in-container against bind-mounted
# src/). Distinct container names / volume / ports from test so both can run at
# once. Bring up in FOREGROUND (`npm run dev`); Ctrl+C → graceful SIGTERM.
services:
  db:
    image: postgres:16-alpine
    container_name: pet-oasis-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: pet-oasis-dev-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  app:
    build:
      target: dev
    container_name: pet-oasis-dev-app
    env_file: .env.development
    environment:
      # env_file keeps localhost/1025 for host tooling; inside the compose network
      # the container reaches the services by name.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      SMTP_HOST: mailpit
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      # Anonymous volume: keeps the container's generated Prisma client from being
      # masked by the host's src/ bind-mount (entrypoint runs `prisma generate`).
      - /app/src/generated

volumes:
  dev_pgdata:
