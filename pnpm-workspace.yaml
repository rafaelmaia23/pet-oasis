# Um workspace, um lockfile (pnpm-lock.yaml na raiz). Cada app e cada pacote
# interno é um projeto do workspace; `pnpm --filter <nome> <script>` roda o
# script daquele projeto a partir da raiz.
packages:
  - apps/*
  - packages/*

fetchTimeout: 60000
fetchRetries: 2
fetchRetryMintimeout: 2000
fetchRetryMaxtimeout: 15000

# Vale para o workspace inteiro: só estes pacotes podem rodar script de build
# no install (o pnpm bloqueia os demais).
allowBuilds:
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
  vue-demi: true # postinstall só lê a versão do Vue instalada e escolhe o build 2/3; vem do @scalar/api-reference (docs da API)
