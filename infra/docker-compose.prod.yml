# Prod override — o sistema inteiro: api (runtime bundle) + web (standalone do
# Next) + Postgres-de-prod + Redis. No mailpit, no dev/test DB. SMTP comes
# entirely from apps/api/.env.production (e.g. Resend).
#
# Um stack, dois tempos de deploy: `pnpm prod:up` (na raiz) sobe tudo;
# `pnpm prod:up api` (ou `web`) reconstrói e reinicia só aquele serviço — o
# outro continua rodando a imagem que já tinha. Monorepo não é monólito: a API
# anda à frente do front, e o deploy de um não derruba o outro.
#
# NENHUMA porta é publicada no host: nem a do banco, nem a do cache, nem a da
# API, nem a do web. O nginx alcança os dois por DNS de container na rede
# `proxy`, e manutenção de banco é `docker exec`. Ver o bloco `networks:` no fim
# do arquivo.
services:
  db:
    image: postgres:16-alpine
    container_name: pet-oasis-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pet-oasis-prod-redis
    restart: unless-stopped
    volumes:
      - prod_redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      target: runtime
    container_name: pet-oasis-api
    # O uid fixado aqui, e não herdado do `USER node` da imagem base: é ele que
    # precisa casar com o dono do UPLOAD_HOST_DIR no host. Um bump da base que
    # mudasse o uid do usuário `node` viraria EACCES no primeiro upload — e o
    # sintoma (500 ao enviar imagem) não aponta para a causa. 1000:1000 é o que
    # a node:24-bookworm-slim usa hoje; o guia de deploy manda chownar o
    # diretório para o mesmo par, e os dois números mudam juntos ou nenhum.
    user: "1000:1000"
    env_file: ../apps/api/.env.production
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # > the app's graceful-shutdown timeout (10s) so draining finishes first.
    stop_grace_period: 15s
    # Sem `ports:` — a porta 3000 fica só no `expose:` do compose base. É o que
    # torna seguro o `trust proxy` por endereço privado do `app.ts` (10.2):
    # conexão vinda da internet direto na API não existe, então `X-Forwarded-For`
    # forjado da internet também não. Republicar a porta aqui reabre o furo.
    networks:
      backend:
        aliases:
          - api
      frontend:
        aliases:
          - api
      # Sem alias `api` aqui, de propósito: a `proxy` é compartilhada com o NPM
      # e com qualquer outro projeto que ele sirva neste host, e `api` é o nome
      # genérico que um segundo projeto mais provavelmente declararia — dois
      # aliases iguais viram round-robin no DNS do Docker, e o proxy alterna
      # entre as duas APIs em silêncio. O proxy host aponta para o nome que
      # identifica o container, `pet-oasis-api`. (O nome do serviço, `api`,
      # continua resolvendo nesta rede — o Compose sempre o publica —, por isso
      # o guia manda apontar para `pet-oasis-api` e nunca para `api`.)
      proxy: {}
    volumes:
      # Bind mount (9.10/AA2), com o caminho do host configurável: hoje o Node
      # serve `/uploads` por `express.static`, e o dia em que o nginx da frente
      # passar a servi-lo direto (`alias`) é config, não deploy novo. O
      # diretório precisa existir e ser gravável pelo uid fixado acima.
      #
      # O caminho precisa ficar **fora do working tree** do repo clonado (10.4):
      # lá dentro, o git escreve como o usuário do host e o container como uid
      # 1000, e não há dono que satisfaça os dois — o que já abortou um `pull`
      # pela metade e derrubou o seed com EACCES.
      #
      # Sem fallback, de propósito: o `:-./uploads` que estava aqui era o
      # caminho silencioso de volta para dentro da árvore. Faltando a variável,
      # o `prod:up` falha nomeando-a, que é a mensagem certa.
      #
      # E **absoluto**, porque fonte relativa resolve contra o diretório do
      # projeto do Compose — o do primeiro `-f`, este `infra/` —, não contra a
      # raiz do repo: `./uploads` aqui era `<repo>/infra/uploads`, não
      # `<repo>/apps/api/uploads`. É o mesmo motivo de o compose de dev pedir
      # `../apps/api/uploads`.
      - "${UPLOAD_HOST_DIR:?obrigatorio - caminho absoluto FORA do working tree, ex. /srv/pet-oasis-data/uploads}:/app/uploads"

  # O front: o bundle standalone do Next, servido por `node server.js` como
  # usuário não-root. Declarado inteiro aqui (e não na base) porque só existe
  # como container em produção — em dev roda no host. Ver a base.
  web:
    build:
      # A raiz do monorepo, pelo mesmo motivo da API (o workspace vive lá); o
      # ignore que vale é `apps/web/Dockerfile.dockerignore`, que exclui a API.
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runtime
      # Mesmo motivo do `network: host` da API na base (MagicDNS do Tailscale).
      network: host
    container_name: pet-oasis-web
    restart: unless-stopped
    # As variáveis do web (hoje nenhuma; a sessão e o endereço interno da API
    # nascem nas issues da Fase 12 que os introduzem). O arquivo precisa
    # existir, mesmo vazio: é a garantia de que quem faz deploy leu o
    # `.env.example` dele.
    env_file: ../apps/web/.env.production
    # Sem `depends_on: api`, de propósito (ADR-0004 do web): o front sobe com a
    # API fora e vice-versa — o que falha nesse caso é a chamada, não o `up`. E
    # `up --build web` também construiria as dependências declaradas, o que
    # faria o deploy só do web reconstruir a API por arrasto.
    # Declara a porta de escuta sem publicá-la: quem alcança o web é o nginx,
    # pela rede `proxy`. Publicar a porta abriria um caminho que desvia do TLS e
    # do rate limit da frente.
    expose:
      - "3001"
    # Duas redes, e a `backend` não é uma delas, de propósito: o web fala com a
    # API (`http://api:3000`, server-side, pela `frontend`) e é servido pelo
    # nginx (pela `proxy`); Postgres e Redis ele não alcança.
    networks:
      frontend: {}
      # Sem alias genérico na `proxy`, pelo mesmo motivo da API: o proxy host
      # aponta para `pet-oasis-web`.
      proxy: {}

# Três redes, três papéis. A API é o único serviço nas três — é ela que atravessa
# a fronteira entre os dados e quem os pede.
networks:
  # Onde os dados vivem. `internal: true` = sem gateway para fora, então nem o
  # Postgres nem o Redis têm rota para a internet e ninguém os alcança de fora.
  # A API continua com saída (SMTP, etc.) pelas outras duas, que não são
  # internas.
  backend:
    internal: true

  # Entre a API e os clientes internos dela (hoje o `web`). Quem entra aqui
  # alcança a API e **não** alcança Postgres nem Redis.
  #
  # Do stack, não `external:` — a diferença em relação à `pet-oasis` que a
  # antecedeu (Fase 10). Aquela era externa porque ligava DOIS stacks (o da API
  # e o do front, cada um no seu repositório), e rede que liga stacks vive mais
  # que qualquer um deles. Com os dois serviços no mesmo stack, a rede é dele:
  # nasce no `up`, morre no `down`, e o "up do web falhou porque a rede da API
  # não existe" deixa de ser possível por construção. Ver
  # apps/api/docs/adr/0148-tres-redes-papeis-distintos-porta-api-despublicada.md.
  frontend: {}

  # A rede do reverse proxy, criada fora deste repositório (o nginx do servidor
  # não é versionado aqui — ver apps/api/docs/adr/0161-reverse-proxy-upload-existe-nao-neste-repositorio.md). Declarada, e não
  # mais conectada à mão com `docker network connect` depois de cada deploy:
  # passo manual esquecido é a API inalcançável pelo público, com o container de
  # pé e o healthcheck verde.
  proxy:
    external: true

volumes:
  prod_pgdata:
  prod_redisdata:
