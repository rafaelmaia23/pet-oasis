# Override de produção — o container do front no MESMO network Docker da API
# (ADR-0004), para que toda chamada server-side vá pela rede interna e nunca
# pela URL pública.
#
# O network é criado pelo compose de produção da API (`-p pet-oasis-prod`, sem
# bloco `networks:` → default do projeto), então aqui ele entra como externo:
# este compose se junta a um network que já existe, nunca o cria. Se a API não
# estiver de pé, o `up` falha dizendo que o network não existe — o que é a
# mensagem certa.
services:
  web:
    build:
      target: runtime
    container_name: pet-oasis-web
    env_file: ../.env.production
    ports:
      - "${WEB_PORT:-3001}:3001"
    networks:
      - api

networks:
  api:
    external: true
    name: ${API_NETWORK:-pet-oasis-prod_default}
