# Base compose — shared `api` skeleton only. Per-environment overrides add the
# databases / mailpit and complete the api service (build target, env_file,
# mounts, ports):
#   dev  → docker-compose.dev.yml   (db + mailpit + api via tsx watch)
#   prod → docker-compose.prod.yml  (db + api runtime bundle; no mailpit)
#   test → docker-compose.test.yml  (db [+ mailpit via `--profile mail`]; NO api,
#                                    Vitest runs the app in-process on the host)
#
# Always invoke through the package.json scripts, which pass `-p <project>`,
# `--env-file .env.<env>` and the right `-f` files. Never a bare `docker compose`.
services:
  # `api` e não `app`: o nome do serviço é o que o DNS da rede do Compose
  # publica, então ele É o endereço que um cliente interno (o front) escreve no
  # código. Renomear o serviço é renomear o contrato.
  api:
    build:
      # A raiz do repo, não infra/ — os caminhos aqui são relativos a este
      # arquivo. Com o contexto na raiz, o Dockerfile é achado em
      # <context>/Dockerfile e o .dockerignore da raiz continua valendo.
      context: ..
      # Host DNS is Tailscale MagicDNS (100.100.100.100), reachable only from the
      # host network namespace; Docker's default bridge can't route to it, so
      # container DNS lookups during `pnpm install` hang. Building on the host network
      # sidesteps it without touching the daemon's global DNS config.
      network: host
    restart: unless-stopped
    expose:
      - "3000"
    # A topologia de rede é por ambiente e vive nos overrides: produção tem três
    # redes com papéis distintos (uma `internal:` com os dados, uma nomeada e
    # compartilhada com clientes internos, e a do nginx, externa a este repo) e
    # dev tem a `default` do projeto. Só a de produção pode declarar a rede do
    # proxy como `external:`, porque só lá ela existe — declará-la aqui quebraria
    # o `pnpm run dev` de quem nunca subiu um nginx.
    #
    # Nas redes do projeto (`backend`, `pet-oasis`) o serviço leva um **alias
    # explícito** `api`, mesmo o Compose já criando um implícito com o nome do
    # serviço: DNS que some numa renomeação falha em silêncio (o cliente vê
    # ENOTFOUND, não uma pista), e essa é a falha cara aqui. Na rede `proxy`,
    # compartilhada com outros projetos, o alias genérico é o oposto — um risco
    # de colisão — e o proxy aponta para o nome do container (ver o override de
    # produção).
