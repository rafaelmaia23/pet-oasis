# Base compose — shared `app` skeleton only. Per-environment overrides add the
# databases / mailpit and complete the app service (build target, env_file,
# mounts, ports):
#   dev  → docker-compose.dev.yml   (db + mailpit + app via tsx watch)
#   prod → docker-compose.prod.yml  (db + app runtime bundle; no mailpit)
#   test → docker-compose.test.yml  (db [+ mailpit via `--profile mail`]; NO app,
#                                    Vitest runs the app in-process on the host)
#
# Always invoke through the npm scripts, which pass `-p <project>`,
# `--env-file .env.<env>` and the right `-f` files. Never a bare `docker compose`.
services:
  app:
    build:
      # A raiz do repo, não infra/ — os caminhos aqui são relativos a este
      # arquivo. Com o contexto na raiz, o Dockerfile é achado em
      # <context>/Dockerfile e o .dockerignore da raiz continua valendo.
      context: ..
      # Host DNS is Tailscale MagicDNS (100.100.100.100), reachable only from the
      # host network namespace; Docker's default bridge can't route to it, so
      # container DNS lookups during `npm ci` hang. Building on the host network
      # sidesteps it without touching the daemon's global DNS config.
      network: host
    restart: unless-stopped
    expose:
      - "3000"
